services:
  - type: web
    name: vocab-vault-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
