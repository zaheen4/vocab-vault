name: keepalive

on:
  # Parked until demo day: uncomment `schedule` to keep the Render free-tier
  # API permanently warm (it sleeps after ~15 min idle). Schedules only run
  # on `main`. Manual pings via workflow_dispatch work anytime.
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://vocab-vault-api.onrender.com/api/health)
          echo "health status: $code"
          test "$code" = "200"
