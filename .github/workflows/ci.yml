name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: lint, unit, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint client (oxlint)
        run: npm run lint -w client

      - name: Lint class hygiene (eslint)
        run: npm run lint:tw -w client

      - name: Unit tests (vitest)
        run: npm test

      - name: Dependency audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (no committed credentials)
        run: |
          ! rg -n --glob '!package-lock.json' --glob '!*.map' \
            -e 'mongodb\+srv://[^/]*@[^/]+\.mongodb\.net' \
            -e 'BEGIN [A-Z ]*PRIVATE KEY' \
            -e 'ghp_[A-Za-z0-9]{20,}' \
            -e 'gho_[A-Za-z0-9]{20,}' \
            -e 'sk-(live|proj)-[A-Za-z0-9]{10,}' \
            . || (echo 'Committed secret detected' && exit 1)

      - name: Check server syntax
        run: find server/src -name '*.js' -not -name '*.test.js' -exec node --check {} +

      - name: Client build (prod API shape)
        run: npm run build -w client
        env:
          VITE_API_URL: https://vocab-vault-api.onrender.com/api
